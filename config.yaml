mode: simulation  # simulation | sandbox
symbol: BTC/USDT
tick_seconds: 5
max_ticks: 200
log_level: INFO

grid:
  center_price: 43000
  spacing: 150
  levels: 4
  order_size: 0.001
  max_exposure_quote: 500
  lower_bound: 41000
  upper_bound: 45000

risk:
  daily_loss_limit_pct: 2.0
  max_drawdown_pct: 5.0
  crash_drop_pct: 1.0
  crash_window_ticks: 3
  cancel_open_orders_on_pause: true

performance:
  adjust_interval_ticks: 60
  center_shift_pct_limit: 0.5
  spacing_min: 75
  spacing_max: 400
  order_size_min: 0.0005
  order_size_max: 0.002

simulation:
  starting_base: 0.0
  starting_quote: 1000.0
  drift: 0.0002
  volatility: 0.003
  fee_rate: 0.0004
  seed: 42

sentiment:
  weight: 0.15

health:
  max_stale_price_secs: 30
  max_error_streak: 3

profit_sweeper:
  cosmetics_goal: 50.0
  sweep_interval_ticks: 100

exchange:
  name: binance
  sandbox: true
  dry_run: true
  api_key_env: BINANCE_SANDBOX_API_KEY
  api_secret_env: BINANCE_SANDBOX_API_SECRET

persistence:
  enabled: true
  db_path: data/state.db
  restore_last_grid: true
